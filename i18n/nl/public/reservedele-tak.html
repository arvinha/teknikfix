<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedankt voor je bestelling | TeknikFix</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="book-page">
  {{HEADER}}
  <main id="indhold">
    <section class="section">
      <div class="wrap">
        <div class="panel form-done" id="order-done">
          <div class="done-mark" aria-hidden="true">✓</div>
          <h1>Bedankt voor je bestelling</h1>
          <p id="order-text">We controleren de betaling…</p>
          <div class="review" id="order-lines" hidden></div>
          <p><a class="btn btn-ghost" href="/reservedele">Terug naar reserveonderdelen</a></p>
        </div>
      </div>
    </section>
  </main>
  {{FOOTER}}
  <script src="/js/site.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var text = document.querySelector("#order-text");
      var box = document.querySelector("#order-lines");
      var kr = new Intl.NumberFormat("da-DK");
      function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      var tries = 0;
      function check() {
        fetch("/api/dele/bekraeft?" + new URLSearchParams({ ordre: params.get("ordre") || "", session_id: params.get("session_id") || "" }))
          .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
          .then(function (res) {
            if (res.status === 202 && tries < 5) { tries += 1; setTimeout(check, 2000); return; }
            if (res.status !== 200) { text.textContent = res.body.message || "We konden de bestelling niet vinden. Je krijgt een mail zodra de betaling is geregistreerd."; return; }
            var o = res.body;
            try { localStorage.removeItem("teknikfix.cart.v1"); } catch (e) {}
            text.innerHTML = "Bestelnummer <strong>" + esc(o.ref) + "</strong><br>" + "De bon is gestuurd naar " + esc(o.email) + ", en je krijgt een trackingnummer per mail zodra het pakket is verzonden.";
            box.hidden = false;
            box.innerHTML = "<ul>" + o.items.map(function (i) { return "<li><span class=\"review-label\">" + i.qty + " ×</span><span class=\"review-value\">" + esc(i.title) + "</span><strong>" + kr.format(i.priceDkk * i.qty) + " kr</strong></li>"; }).join("") +
              "<li><span class=\"review-label\"></span><span class=\"review-value\">Verzending</span><strong>" + kr.format(o.shippingDkk) + " kr</strong></li></ul>" +
              "<div class=\"review-price\"><span>Betaald</span><strong>" + kr.format(o.paidDkk) + " kr</strong></div>";
          })
          .catch(function () { text.textContent = "We konden de betaling nu even niet controleren. Je krijgt een mail zodra die is geregistreerd."; });
      }
      check();
    })();
  </script>
</body>
</html>
