<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seuraa korjaustasi | TeknikFix Aalborg</title>
  <meta name="description" content="Seuraa korjaustasi TeknikFixillä ja maksa, kun korjaus on valmis. Tarvitset tapausnumeron ja sähköpostiosoitteen.">
  <link rel="canonical" href="{{ORIGIN}}/sag">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Seuraa korjaustasi | TeknikFix">
  <meta property="og:url" content="{{ORIGIN}}/sag">
  <meta property="og:image" content="{{ORIGIN}}/og.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="da_DK">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  {{HEADER}}
  <main id="indhold">
    <header class="page-hero">
      <div class="wrap">
        <nav class="crumbs" aria-label="Murupolku"><a href="/">Etusivu</a><span aria-hidden="true">/</span><span>Seuraa tapausta</span></nav>
        <h1>Seuraa tapaustasi</h1>
        <p class="lead">Kirjoita kuitissa oleva tapausnumero ja sähköpostiosoite, jolla teit varauksen. Täällä voit hyväksyä hinnan ja maksaa, kun korjaus on valmis.</p>
      </div>
    </header>
    <section class="section">
      <div class="wrap narrow stack">
        <form class="panel" id="find-sag">
          <label class="field"><span>Tapausnumero</span><input name="ref" required maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="AX-7K2M"></label>
          <label class="field"><span>Sähköposti</span><input name="email" type="email" required autocomplete="email"></label>
          <button class="btn" type="submit">Näytä tapaus</button>
          <p id="find-error" class="form-error" hidden></p>
        </form>
        <div id="sag-view" class="panel" hidden></div>
        <div id="pay-config" hidden data-paypal="{{PAYPAL}}" data-iban="{{IBAN_PRETTY}}" data-bic="{{BIC}}" data-bank="{{BANK}}" data-holder="{{HOLDER}}" data-card="{{CARD_ENABLED}}"></div>
      </div>
    </section>
  </main>
  {{FOOTER}}
  <script src="/js/site.js"></script>
  <script src="/js/labels.js"></script>
  <script src="/js/sag.js"></script>
</body>
</html>
